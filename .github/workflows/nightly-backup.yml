# A full copy of the school's database, every night, kept outside Supabase.
#
# Why this exists: the project is on Supabase's free plan, which takes no
# backups at all (Database → Backups says so in as many words). Until that is
# upgraded this workflow is the ONLY copy of the school year, and it stays
# useful afterwards too — Supabase deletes a project's backups along with the
# project, so a copy that lives somewhere else is the one that survives a
# mistake in the account.
#
# The dump is encrypted before it is stored, because this repository is public
# and a workflow artifact on a public repository can be downloaded by anyone.
# The file holds pupils' names, national ids, guardians' mobile numbers and
# password hashes; it must never be readable without the passphrase.
#
# Two repository secrets are required — Settings → Secrets and variables →
# Actions → New repository secret:
#   BACKUP_DATABASE_URL  the connection string with port 5432, NOT 6543.
#                        pg_dump needs a session connection; the transaction
#                        pooler the app uses cannot serve a dump.
#   BACKUP_PASSPHRASE    a long random passphrase. Save it in a password
#                        manager: without it the backups cannot be read, and
#                        GitHub will not show it to you again.
name: nightly-backup

on:
  schedule:
    # 22:00 UTC = 01:00 in Riyadh, after the school day is recorded.
    - cron: '0 22 * * *'
  # So it can be run by hand from the Actions tab, which is also how the first
  # one should be taken — never trust a backup you have not seen succeed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install the matching PostgreSQL client
        run: |
          set -euo pipefail
          # The database is PostgreSQL 17; an older pg_dump refuses to dump it.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # Not `pg_dump`: /usr/bin/pg_dump is a wrapper that prefers the
          # client the runner already had (16.15), and pg_dump refuses to dump
          # a server newer than itself. Name the binary, then check it really
          # is 17 — a silent downgrade here means no backup at all.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          if [ ! -x "$PG_DUMP" ]; then
            echo "::error::postgresql-client-17 did not install $PG_DUMP"
            exit 1
          fi
          "$PG_DUMP" --version
          case "$("$PG_DUMP" --version)" in
            *" 17."*) ;;
            *) echo "::error::Expected pg_dump 17, got: $("$PG_DUMP" --version)" ; exit 1 ;;
          esac
          echo "PG_DUMP=$PG_DUMP" >> "$GITHUB_ENV"

      - name: Take the dump and encrypt it
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          # A value pasted into a GitHub secret keeps whatever came with it. A
          # line copied from a Windows file carries a carriage return, and the
          # connection string then ends in "/postgres\r" — Postgres answers
          # 'database "postgres" does not exist' and the newline is invisible in
          # the log. Strip the whitespace here rather than asking anyone to
          # paste perfectly. The passphrase is stripped for the same reason and
          # a better one: a stray newline would silently become part of the
          # encryption key, and every restore typed by hand would then fail.
          DATABASE_URL="$(printf '%s' "${DATABASE_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          PASSPHRASE="$(printf '%s' "${PASSPHRASE:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::BACKUP_DATABASE_URL is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set — add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$DATABASE_URL" in
            *:6543/*) echo "::error::That is the transaction pooler (port 6543). pg_dump needs port 5432." ; exit 1 ;;
          esac

          # Say what we are about to connect to, with the password removed, so
          # a failure names itself instead of hiding in a FATAL from Postgres.
          echo "connecting to: $(printf '%s' "$DATABASE_URL" | sed -E 's#://[^:]+:[^@]*@#://***:***@#')"

          STAMP="$(date -u +%Y-%m-%d)"
          # Custom format: compressed, and pg_restore can pick single tables.
          # Ownership and grants belong to the old project, not a new one.
          # Carried from the install step through GITHUB_ENV; fall back to the
          # same path rather than dying on an unbound variable.
          PG_DUMP="${PG_DUMP:-/usr/lib/postgresql/17/bin/pg_dump}"
          if [ ! -x "$PG_DUMP" ]; then echo "::error::pg_dump 17 is missing at $PG_DUMP"; exit 1; fi

          "$PG_DUMP" --no-owner --no-privileges --format=custom --file=db.dump "$DATABASE_URL"

          SIZE=$(stat -c%s db.dump)
          echo "dump size: $SIZE bytes"
          # A dump that succeeds but holds nothing is worse than no dump at all,
          # because it looks like protection. Refuse it loudly.
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::The dump is only $SIZE bytes — that is too small to be a real's database. Not storing it."
            exit 1
          fi

          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" \
              -o "aws-backup-$STAMP.dump.gpg" db.dump
          rm -f db.dump
          ls -lh "aws-backup-$STAMP.dump.gpg"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: aws-backup-${{ env.STAMP }}
          path: '*.dump.gpg'
          # The longest a free plan keeps an artifact. Supabase Pro adds its own
          # seven days on top of this, from a different place.
          retention-days: 90
          if-no-files-found: error
